# XcodeGen spec. Run `xcodegen generate` to produce colon3.xcodeproj (it's gitignored).
name: colon3
options:
  bundleIdPrefix: com.aminewallah
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  SoulseekKit:
    path: Packages/SoulseekKit

targets:
  colon3:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: SoulseekKit
      - target: TransfersWidget
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: colon3
        # Filled from MARKETING_VERSION / CURRENT_PROJECT_VERSION below; CI overrides both.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # "stable" or "beta"; CI sets it from the branch. Picks the default update channel.
        Colon3Channel: "$(COLON3_CHANNEL)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Wi-Fi Transfer serves a page to computers on the same network.
        NSLocalNetworkUsageDescription: "colon3 uses the local network for Wi-Fi Transfer, so a computer on your Wi-Fi can add or download music."
        # colon3://player, colon3://downloads, … from the Dynamic Island, Shortcuts and Back Tap.
        CFBundleURLTypes:
          - CFBundleURLName: com.aminewallah.colon3
            CFBundleURLSchemes: [colon3]
        # Lets Files and other apps "Open in" / "Copy to" colon3.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - org.xiph.flac
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - public.aifc-audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aminewallah.colon3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        COLON3_CHANNEL: stable
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set this to your Apple ID team in Xcode (Signing & Capabilities) when building in the VM.
        DEVELOPMENT_TEAM: ""
    scheme: {}

  # Live Activity (Dynamic Island / Lock Screen) for transfers.
  TransfersWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: colon3 Transfers
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aminewallah.colon3.TransfersWidget
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

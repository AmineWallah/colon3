# XcodeGen spec. Run `xcodegen generate` to produce colon3.xcodeproj (it's gitignored).
name: colon3
options:
  bundleIdPrefix: com.aminewallah
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  SoulseekKit:
    path: Packages/SoulseekKit

targets:
  colon3:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SoulseekKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: colon3
        # Filled from MARKETING_VERSION / CURRENT_PROJECT_VERSION below; CI overrides both.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Lets Files and other apps "Open in" / "Copy to" colon3.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - org.xiph.flac
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - public.aifc-audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aminewallah.colon3
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set this to your Apple ID team in Xcode (Signing & Capabilities) when building in the VM.
        DEVELOPMENT_TEAM: ""
    scheme: {}
